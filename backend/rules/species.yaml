# ─────────────────────────────────────────────────────────────────────────────
# 종별 치수 기준 (species rules)
#
# ⚠️ 아직 수의사·사육 전문가 검수 전입니다 (reviewed: false).
#    값마다 근거를 주석으로 단다:
#      [근거] 공개 문서에 수치가 있는 값 (출처 약어는 아래 목록)
#      [임시] 근거 수치를 찾지 못한 값. 전문가 검수 때 우선 확인할 것
#    이 파일만 교체하면 서버 재시작 시 반영됩니다. 코드에는 종별 수치를 하드코딩하지 않습니다.
#
# 출처
#   TVT-G  Tierärztliche Vereinigung für Tierschutz (독일 수의사 동물보호협회), Merkblatt "Goldhamster"
#   TVT-Z  같은 협회, Merkblatt "Zwerghamster" (Phodopus: 정글리안·캠벨·로보로브스키)
#   DTSchB Deutscher Tierschutzbund (독일 동물보호연맹), Positionspapier "Tierschutzwidriges Zubehör"
#          (Stand 06/2024), 장 "Kleine Heimtiere"
#   몸길이(머리·몸통, 꼬리 제외) — 터널 최대 길이 계산용
#   K&V    Kryštufek & Vohralík (2009) Mammals of Turkey and Cyprus, Table 4: 골든 야생 성체 128–165mm (n=9)
#          (Handbook of the Mammals of the World vol.7, 2017 도 128–165mm)
#   MS459  Ross (1994) Mammalian Species 459, Phodopus roborovskii: 몽골 67–76, 만주 53–60mm (각 n=4)
#   WV     WikiVet "Hamster Breeds": 로보로브스키 성체 약 5cm
#   'Körperlänge'는 꼬리를 뺀 길이로 본다 (오스트리아 TSch-SV 부록 1: "L bezeichnet die Körperlänge des Tieres ohne Schwanz")
#
# 단위: 길이 mm, 각도 deg
# 형식이 잘못되면(키 누락·오타·범위 오류) 서버가 기동하지 않고 오류를 알려줍니다.
# ─────────────────────────────────────────────────────────────────────────────
version: "0.3-draft"
reviewed: false   # 전문가 검수 완료 시 true 로 변경

species:
  hamster:
    display_name: 햄스터
    sizes:
      dwarf:
        display_name: 드워프 (정글리안·캠벨·로보로브스키)
        # 은신처 출입구(아치형) 최소 폭
        # [근거] TVT-Z: 집·은신처·터널의 출입구는 최소 5cm 폭
        entrance_min_diameter_mm: 50
        # 터널 최소 내경
        # [근거] TVT-Z: 출입구·통로(Röhren) 최소 5cm 폭
        tunnel_min_inner_diameter_mm: 50
        # 터널 최대 길이 = 몸길이의 2배
        # [근거] DTSchB: 플라스틱 튜브는 "höchstens die doppelte Körperlänge des Tieres"일 때만 받아들일 수 있다
        #   몸길이는 이 구분에서 가장 작은 로보로브스키 기준 약 50mm (WV 약 5cm, MS459 최소 53mm) → 2 × 50
        #   정글리안(70–90mm)·캠벨(80–103mm)만 키운다면 140mm 까지도 2배 안이지만, 크기 구분이 하나라 작은 쪽에 맞춘다
        tunnel_max_length_mm: 100
        # 끼임 틈새 한계: safe_max < 틈 < passable_min 이면 끼임 위험으로 판정
        gap_trap:
          safe_max_mm: 4        # [임시] 발가락·발이 들어가지 않는 틈 (환기구 최대 지름도 이 값)
          passable_min_mm: 50   # [근거] 출입구 최소 폭(TVT-Z 5cm)과 같게 둔다
        # 갉음 내구성을 고려한 최소 벽 두께 (출력 기준 min_wall 과 비교해 큰 값 적용)
        min_wall_thickness_mm: 2.4      # [임시]
        max_ramp_angle_deg: 30          # [임시] 램프 최대 경사각
        max_climb_height_mm: 120        # [임시] 오르는 구조물(램프·계단) 최대 높이 – 낙상 위험
        max_step_height_mm: 35          # [임시] 한 번에 넘는 최대 턱 높이 (계단 1단, 모래목욕통 턱)
        # 모래목욕통 최소 내부 크기 [가로, 세로]
        # [근거] TVT-Z: 모래목욕통 한 변 최소 20cm
        sand_bath_min_inner_mm: [200, 200]
        sand_bath_min_depth_mm: 40      # [임시] 모래목욕통 최소 깊이
        # 은신처 출입구 최소 개수
        hideout_min_entrances:
          # [임시] 혼자 키울 때: 근거 수치 없음 → 추가 요구 없음 (앞 출입구 하나). 햄스터는 단독 사육이 기본이다
          single: 1
          # 두 마리 이상 함께 키울 때
          # [근거] DTSchB: 집 출입구가 하나뿐이면 안 되고 최소 2개가 낫다.
          #   이유는 "서로 피할 수 있고 서열 다툼 때 막다른 곳이 없도록" → 여러 마리일 때만 적용한다
          group: 2
        # 사육장 최소 바닥 [긴 변, 짧은 변]. 작으면 경고 (설계는 막지 않음)
        # [근거] TVT-Z: 사육장 최소 100×50×50cm (가로×세로×높이)
        #   높이는 비교하지 않는다: 입력받는 높이는 바닥재 위 공간이고, TVT 는 바닥재 깊이(드워프 20~25cm)를 따로 요구한다
        enclosure_min_floor_mm: [1000, 500]
        # 권장 최대 마릿수 (초과 시 경고)
        # [근거] TVT-Z: 야생에서 단독 생활, 사육 시에도 단독 사육을 강하게 권장 (쌍 사육은 예외적)
        max_recommended_count: 1
        count_warning_ko: 드워프 햄스터도 야생에서 혼자 사는 동물이라 단독 사육을 강하게 권장합니다. 함께 키우면 다툼·부상 위험이 있습니다.
      syrian:
        display_name: 골든 (시리안)
        # [근거] TVT-G: 집·은신처·통로의 출입구는 최소 7cm 폭 (볼주머니가 찬 상태로도 지나가도록)
        entrance_min_diameter_mm: 70
        tunnel_min_inner_diameter_mm: 70    # [근거] TVT-G 같은 항목
        # [근거] DTSchB 몸길이 2배. 몸길이는 야생 성체 최소 128mm (K&V) → 2 × 128 = 256, 10mm 단위로 내림
        #   집·실험실 골든은 더 크다 (MSD 수의 매뉴얼 170–180mm) → 이 값은 대부분의 골든에게 보수적이다
        tunnel_max_length_mm: 250
        gap_trap:
          safe_max_mm: 5                    # [임시]
          passable_min_mm: 70               # [근거] 출입구 최소 폭(TVT-G 7cm)과 같게 둔다
        min_wall_thickness_mm: 3.0          # [임시]
        max_ramp_angle_deg: 30              # [임시]
        max_climb_height_mm: 150            # [임시]
        max_step_height_mm: 45              # [임시]
        sand_bath_min_inner_mm: [200, 200]  # [근거] TVT-G: 모래목욕통 최소 20×20cm
        sand_bath_min_depth_mm: 50          # [임시]
        hideout_min_entrances:              # 드워프와 같음
          single: 1                         # [임시] 근거 수치 없음 → 추가 요구 없음
          group: 2                          # [근거] DTSchB, 여러 마리일 때만
        # [근거] TVT-G: 사육장 최소 100×50×50cm, 이보다 작으면 안 됨. 높이는 비교하지 않음 (바닥재 25cm 별도)
        enclosure_min_floor_mm: [1000, 500]
        # [근거] TVT-G: 야생에서 번식기 외에는 동족을 용납하지 않는 단독 생활 동물
        max_recommended_count: 1
        count_warning_ko: 골든(시리안) 햄스터는 영역성이 강해 반드시 단독 사육해야 합니다.
