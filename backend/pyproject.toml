[project]
name = "kkomul-backend"
version = "0.1.0"
description = "NestForge 백엔드: 파라메트릭 케이지 구조물 설계 API"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "build123d>=0.13,<0.14",
    "trimesh>=4.4",
    "numpy>=2.0",
    "shapely>=2.0",
    "anthropic>=0.40",
    "networkx>=3.6.1",
    "lxml>=6.1.3",
    "rtree>=1.4.1",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "fast-simplification>=0.1.13",  # 3D 미리보기용 메시 단순화 (numpy 만 필요)
    "fonttools>=4.50",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: 실제 Anthropic API를 호출하는 테스트 (ANTHROPIC_API_KEY 필요)",
]
addopts = "-m 'not live'"
