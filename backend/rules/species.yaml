# ─────────────────────────────────────────────────────────────────────────────
# 종별 치수 기준 (species rules)
#
# ⚠️ 아직 수의사·사육 전문가 검수 전입니다 (reviewed: false).
#    값마다 근거를 주석으로 단다:
#      [근거] 공개 문서에 수치가 있는 값 (출처 약어는 아래 목록)
#      [임시] 근거 수치를 찾지 못한 값. 전문가 검수 때 우선 확인할 것
#    이 파일만 교체하면 서버 재시작 시 반영됩니다. 코드에는 종별 수치를 하드코딩하지 않습니다.
#
# 출처
#   TVT-G  Tierärztliche Vereinigung für Tierschutz (독일 수의사 동물보호협회), Merkblatt "Goldhamster"
#   TVT-Z  같은 협회, Merkblatt "Zwerghamster" (Phodopus: 정글리안·캠벨·로보로브스키)
#   DTSchB Deutscher Tierschutzbund (독일 동물보호연맹), Positionspapier "Tierschutzwidriges Zubehör"
#          (Stand 06/2024), 장 "Kleine Heimtiere"
#   몸길이(머리·몸통, 꼬리 제외) — 터널 최대 길이 계산용
#   K&V    Kryštufek & Vohralík (2009) Mammals of Turkey and Cyprus, Table 4: 골든 야생 개체(터키·시리아) 128–165mm
#          (n=9, 나이 구분 없음. Handbook of the Mammals of the World vol.7, 2017 도 128–165mm)
#   MS459  Ross (1994) Mammalian Species 459, Phodopus roborovskii: 몽골 67–76, 만주 53–60mm (각 n=4)
#   MS595  Ross (1998) Mammalian Species 595, Phodopus sungorus(정글리안): 70–90mm
#   MS503  Ross (1995) Mammalian Species 503, Phodopus campbelli(캠벨): 80–103mm
#   WV     WikiVet "Hamster Breeds": 로보로브스키 성체 약 5cm (꼬리 포함 여부는 밝히지 않음)
#   'Körperlänge'는 꼬리를 뺀 길이로 본다 (오스트리아 TSch-SV 부록 1: "L bezeichnet die Körperlänge des Tieres ohne Schwanz")
#
# 어항(담수 관상어·새우) 출처 — 항목별 인용과 한계는 rules/aquarium-evidence.md
#   THVO-AT 오스트리아 2. Tierhaltungsverordnung 부속서 2 (관상어): 54L 미만 상시 사육 금지, '60cm' 등급 = 60×30×30cm,
#           'Gesellig'(무리형) 최소 5마리
#   BMEL    독일 연방식품농업부 "Mindestanforderungen an die Haltung von Zierfischen" 감정서·종별 표 (54L 최소, 60L 권장)
#   BLV     스위스 연방 식품안전수의청 소책자 "Aquarienfische" (소형 테트라·베타도 54L 이상, 카디널 10마리·코리도라스 6마리 이상)
#   TSchV-CH 스위스 동물보호령 부속서 2 표 8: 수조 부피 = 몸길이(cm) × 등급별 L/cm × 마리 수 (몸길이 5cm 이하 0.5, 10cm 이하 0.75),
#           수심 ≥ 가장 큰 물고기 몸길이 1배. 진새우류(Caridea)는 갑각류 규정에서 빠진다
#   OATA    영국 관상어협회 사육 안내 (소형 새우 무리 10L 이상·5마리 이상, 테트라 5마리 이상, 체리·비 새우 약 3cm)
#   SF      Seriously Fish 종 정보 (성체 최대 표준체장 SL)
#   FB      FishBase 형태 측정값 (체고 = 전장 대비 %, 종마다 사진 1장) — SF 최대 SL 과 조합해 계산한 값은 '계산값'으로 적는다
#   MS18    Mitsugi & Suzuki (2018) Crustacean Research 47: 체리새우 야외 개체 가장 큰 암컷 몸길이 30.0mm, 가장 작은 갑각 길이 0.8mm
#   N2A     nature2aqua.de 점토 동굴·관 제품 정보 (새우용 최소 동굴 안지름 약 15mm, 막힌 동굴 경고) — 판매 정보라 근거가 약하다
#   J23     Jones et al. (2023) Animal Behaviour: 큰가시고기(4~5cm)가 지름 2.2cm 관에도 들어가고, 넓은 관을 더 자주 고름
#   Prusa-W Prusa 도움말 "Watertight prints": 벽 하나에 둘레선 3~4줄 이상
#   EHEIM   EHEIM 수조 안내서: 윗가장자리에서 약 3cm 아래까지 물을 채운다
#   글10    NestForge 커뮤니티 글 「어항에 3D 출력물, 수질 면에서 써도 될까요」(소재·노즐·채움·세척 조건)
#   어항 기준은 모두 담수 기준이다. 해수(리프)는 다루지 않는다.
#
# 단위: 길이 mm, 각도 deg
# 형식이 잘못되면(키 누락·오타·범위 오류) 서버가 기동하지 않고 오류를 알려줍니다.
# ─────────────────────────────────────────────────────────────────────────────
version: "0.4-draft"
reviewed: false   # 전문가 검수 완료 시 true 로 변경

species:
  hamster:
    display_name: 햄스터
    habitat: cage                                 # cage: 케이지 / aquarium: 어항
    templates: [hideout, tunnel, ramp, sand_bath]   # 이 종에 만들 수 있는 구조물
    max_count: 10                                 # 입력할 수 있는 최대 마릿수
    sizes:
      dwarf:
        display_name: 드워프 (정글리안·캠벨·로보로브스키)
        # 은신처 출입구(아치형) 최소 폭
        # [근거] TVT-Z: 집·은신처·터널의 출입구는 최소 5cm 폭
        entrance_min_diameter_mm: 50
        # 터널 최소 내경
        # [근거] TVT-Z: 출입구·통로(Röhren) 최소 5cm 폭
        tunnel_min_inner_diameter_mm: 50
        # 터널 최대 길이 = 몸길이의 2배
        # [근거] DTSchB: 플라스틱 튜브는 "höchstens die doppelte Körperlänge des Tieres"일 때만 받아들일 수 있다
        #   몸길이는 이 구분에서 가장 작은 로보로브스키 기준 약 50mm (WV 약 5cm, MS459 최소 53mm) → 2 × 50.
        #   mm 값 자체는 출처에 없고 위 몸길이로 계산한 값이다.
        #   정글리안(70–90mm, MS595)·캠벨(80–103mm, MS503)만 키운다면 140mm 까지도 2배 안이지만, 크기 구분이 하나라 작은 쪽에 맞춘다.
        #   이 길이에서는 굽힘 반경 ≥ 내경 조건 때문에 U자 터널(180°)은 만들 수 없다 (최소 내경 50mm 에서 최대 약 115°)
        tunnel_max_length_mm: 100
        # 끼임 틈새 한계: safe_max < 틈 < passable_min 이면 끼임 위험으로 판정
        gap_trap:
          safe_max_mm: 4        # [임시] 발가락·발이 들어가지 않는 틈 (환기구 최대 지름도 이 값)
          passable_min_mm: 50   # [근거] 출입구 최소 폭(TVT-Z 5cm)과 같게 둔다
        # 갉음 내구성을 고려한 최소 벽 두께 (출력 기준 min_wall 과 비교해 큰 값 적용)
        min_wall_thickness_mm: 2.4      # [임시]
        max_ramp_angle_deg: 30          # [임시] 램프 최대 경사각
        max_climb_height_mm: 120        # [임시] 오르는 구조물(램프·계단) 최대 높이 – 낙상 위험
        max_step_height_mm: 35          # [임시] 한 번에 넘는 최대 턱 높이 (계단 1단, 모래목욕통 턱)
        # 모래목욕통 최소 내부 크기 [가로, 세로]
        # [근거] TVT-Z: 모래목욕통 한 변 최소 20cm
        sand_bath_min_inner_mm: [200, 200]
        sand_bath_min_depth_mm: 40      # [임시] 모래목욕통 최소 깊이
        # 은신처 출입구 최소 개수
        hideout_min_entrances:
          # [임시] 혼자 키울 때: 근거 수치 없음 → 추가 요구 없음 (앞 출입구 하나). 햄스터는 단독 사육이 기본이다
          single: 1
          # 두 마리 이상 함께 키울 때
          # [근거] DTSchB: 집 출입구가 하나뿐이면 안 되고 최소 2개가 낫다.
          #   이유는 "서로 피할 수 있고 서열 다툼 때 막다른 곳이 없도록" → 여러 마리일 때만 적용한다
          group: 2
        # 사육장 최소 바닥 [긴 변, 짧은 변]. 작으면 경고 (설계는 막지 않음)
        # [근거] TVT-Z: 사육장 최소 100×50×50cm (가로×세로×높이)
        #   높이는 비교하지 않는다: 입력받는 높이는 바닥재 위 공간이고, TVT 는 바닥재 깊이(드워프 20~25cm)를 따로 요구한다
        enclosure_min_floor_mm: [1000, 500]
        # 권장 최대 마릿수 (초과 시 경고)
        # [근거] TVT-Z: 야생에서 단독 생활, 사육 시에도 단독 사육을 강하게 권장 (쌍 사육은 예외적)
        max_recommended_count: 1
        count_warning_ko: 드워프 햄스터도 야생에서 혼자 사는 동물이라 단독 사육을 강하게 권장합니다. 함께 키우면 다툼·부상 위험이 있습니다.
      syrian:
        display_name: 골든 (시리안)
        # [근거] TVT-G: 집·은신처·통로의 출입구는 최소 7cm 폭 (볼주머니가 찬 상태로도 지나가도록)
        entrance_min_diameter_mm: 70
        tunnel_min_inner_diameter_mm: 70    # [근거] TVT-G 같은 항목
        # [근거] DTSchB 몸길이 2배. 몸길이는 야생 개체 최소 128mm (K&V) → 2 × 128 = 256, 10mm 단위로 내림 (mm 값은 계산값)
        #   집·실험실 골든은 대개 이보다 크다 (MSD 수의 매뉴얼 170–180mm, 애완 골든 13cm 안팎이라는 자료도 있다)
        tunnel_max_length_mm: 250
        gap_trap:
          safe_max_mm: 5                    # [임시]
          passable_min_mm: 70               # [근거] 출입구 최소 폭(TVT-G 7cm)과 같게 둔다
        min_wall_thickness_mm: 3.0          # [임시]
        max_ramp_angle_deg: 30              # [임시]
        max_climb_height_mm: 150            # [임시]
        max_step_height_mm: 45              # [임시]
        sand_bath_min_inner_mm: [200, 200]  # [근거] TVT-G: 모래목욕통 최소 20×20cm
        sand_bath_min_depth_mm: 50          # [임시]
        hideout_min_entrances:              # 드워프와 같음
          single: 1                         # [임시] 근거 수치 없음 → 추가 요구 없음
          group: 2                          # [근거] DTSchB, 여러 마리일 때만
        # [근거] TVT-G: 사육장 최소 100×50×50cm, 이보다 작으면 안 됨. 높이는 비교하지 않음 (바닥재 25cm 별도)
        enclosure_min_floor_mm: [1000, 500]
        # [근거] TVT-G: 야생에서 번식기 외에는 동족을 용납하지 않는 단독 생활 동물
        max_recommended_count: 1
        count_warning_ko: 골든(시리안) 햄스터는 영역성이 강해 반드시 단독 사육해야 합니다.

  # ───────────────────────────────────────────────────────────────────────────
  # 어항 (담수 관상어·새우)
  #   크기 구분은 '함께 키우는 동물 무리'로 나눈다. 여러 구분을 함께 키우면 합사 수조(community)를 고른다.
  #   입력 치수: 가로·세로는 수조 안쪽, 높이는 '물 깊이'(바닥재 위 ~ 수면)로 받는다.
  #   만들 수 있는 구조물은 물속 동굴(cave)과 터널뿐이다. 램프·모래목욕통은 어항에 맞지 않는다.
  #   물속 동굴은 지붕이 꼭대기 구멍 쪽으로 기울어 안에 공기가 갇히지 않는다(바닥이 열린 상자형 은신처는 공기가 갇혀 뜰 수 있어 어항에 쓰지 않는다).
  # ───────────────────────────────────────────────────────────────────────────
  aquarium:
    display_name: 어항 (담수 관상어·새우)
    habitat: aquarium
    templates: [cave, tunnel]
    # [임시] 무리·군체를 키우므로 케이지(10)보다 넉넉하게 받는다. 마릿수는 무리 크기·수조 부피 안내에만 쓴다
    max_count: 200
    # 부력(물속 무게) 계산
    buoyancy:
      # [근거] PLA 1.24 (NatureWorks 4043D·Bambu PLA Basic 데이터시트), PETG 1.27 (Prusament PETG 데이터시트, 1.24 표기도 있음)
      #   → 보수적으로 둘 다 1.24 로 계산한다. 채움 100% 기준이며 착색·첨가제가 들어가면 달라진다
      material_density_g_cm3: 1.24
      water_density_g_cm3: 0.997      # [근거] 25°C 담수 (해수는 다루지 않는다)
    # 출력·설치 안내. 글10 의 조건과 같게 둔다 ("안전하다"가 아니라 "이 조건이면 위험이 낮아 보인다")
    print_notes_ko:
      - 어항 수질에 안전하다고 증명된 3D 출력 소재는 없어요. 아래는 위험을 낮추는 조건이에요.
      - "소재: 무착색 PETG가 1순위예요. 수온이 25°C 안팎인 담수 어항이면 무착색 PLA도 조건부로 쓸 수 있어요. 새우가 있는 수조(새우·합사 수조)나 오래 둘 물건은 PETG로 출력하세요."
      - "빼야 할 소재: 레진(광경화) 출력물, 나일론, 우드·금속·카본·실크·반짝이·야광·형광 필라멘트는 쓰지 마세요. ABS·ASA도 권하지 않아요."
      - "노즐: 스테인리스나 티타늄 노즐을 쓰세요. 새우 수조라면 꼭 바꾸세요."
      - "출력: 채움 100%, 외벽(둘레선) 4줄 이상으로 출력해 속에 빈 공간이 없게 하세요. 속이 빈 출력물은 물에 뜨거나 안에서 물이 썩을 수 있어요."
      - "넣기 전: 세제·소독제·끓는 물 없이 물로만 씻고, 생물이 없는 물에 며칠 담갔다가 그 물은 버리세요. 지느러미가 닿는 출입구 테두리는 사포로 다듬어 주세요."
      - "넣을 때: 물속에서 이리저리 기울여 안에 남은 공기를 빼고 놓으세요. 출력물은 물속에서 아주 가벼우니 하루 동안 뜨거나 밀리지 않는지 지켜보세요. 히터에는 닿지 않게 5cm쯤 띄워 두세요."
      - "넣은 뒤: 하나씩 넣고 생물과 수질을 지켜보세요. 하얗게 뜨거나 갈라지거나 물러지면 바꿔 주세요. 붙여야 한다면 어항용이라고 적힌 접착제만 쓰세요."
    sizes:
      shrimp:
        display_name: 새우 (체리·비 새우 등 소형 새우만 키울 때)
        # 구분: 성체 몸길이 30mm 이하 소형 담수 새우(Neocaridina davidi 색변이, 소형 Caridina). 아마노 새우·달팽이·가재는 넣지 않는다
        #   [근거] OATA: 체리·비 새우 약 3cm / MS18: 가장 큰 암컷 몸길이 30.0mm (이마뿔 제외)
        # 동굴 출입구 최소 폭
        # [임시] 새우 몸높이를 잰 자료가 없다. N2A 가 '새우와 작은 어항 동물'용으로 파는 가장 작은 동굴(안지름 약 15mm)에 맞췄다
        entrance_min_diameter_mm: 15
        tunnel_min_inner_diameter_mm: 15    # [임시] N2A: 안지름 15·20mm 동굴과 25mm 양쪽 열린 관을 새우가 쓸 수 있다
        # 터널 최대 길이: 두지 않는다 (null)
        #   긴 관이 새우·물고기에게 해롭다는 출처가 없다. 햄스터의 '몸길이 2배'(DTSchB)는 소형 포유류 근거라 옮기지 않는다
        tunnel_max_length_mm: null
        gap_trap:
          # [임시] MS18: 가장 작은 개체 갑각 길이 0.8mm. 지름 약 2.4mm 구멍에 새끼 새우가 머리부터 끼어 죽은 사례가 있어 보수적으로 1mm
          safe_max_mm: 1.0
          passable_min_mm: 15               # [임시] 출입구 최소 폭과 같게 둔다
        # [근거] Prusa-W: 둘레선 3~4줄 → 4줄 × 0.45mm = 1.8mm 를 올림. 공개된 어항 동굴 설계도 2mm 벽을 쓴다
        min_wall_thickness_mm: 2.0
        hideout_min_entrances:
          # [임시] 새우는 꼬리를 쳐서 뒤로 튀어 나가는 도피 반사가 있어 출입구 하나인 동굴도 쓴다 (N2A 도 앞 입구 하나뿐인 동굴을 새우용으로 판다).
          #   행동 근거라 수치 근거는 없다. 물고기와 함께 키우면 합사 수조(community)를 고른다
          single: 1
          group: 1
        # 바닥 면적 기준: 출처가 없어 검사하지 않는다 (부피만 검사)
        enclosure_min_floor_mm: null
        # [근거] OATA: 새우는 무리를 지어 사는 동물이라 5마리 이상
        min_recommended_count: 5
        min_count_warning_ko: 새우는 무리 지어 사는 동물이라 5마리 이상 함께 키우기를 권합니다.
        aquatic:
          # [임시] 동굴 안쪽 천장(모서리선)이 꼭대기 구멍 쪽으로 오르는 최소 경사. 공기가 남지 않게 하는 계산값이며 실측이 없다.
          #   서포트 없이 출력하려면 동굴 템플릿이 40° 이상을 쓰므로 실제로는 템플릿 하한이 적용된다
          ceiling_min_slope_deg: 30
          # [임시] 구조물 꼭대기 위로 남길 물 깊이 (출처 없음, 어류 구분과 같은 하한)
          structure_top_clearance_mm: 30
          # [임시] 수조 전체 부피를 어림할 때 쓰는 바닥재 두께 (새우 수조 수치 출처 없음)
          substrate_depth_assumed_mm: 30
          # [근거] EHEIM: 수조 윗가장자리에서 약 3cm 아래까지 물을 채운다 (수조 부피 어림용)
          air_gap_mm: 30
          # [근거] OATA: 소형 새우 무리는 10L 이상. 법적 수치 기준은 없다 (스위스·오스트리아 규정은 새우 수치를 두지 않는다)
          min_volume_l: 10
          volume_l_per_animal: null         # 새우 사육 밀도 수치 출처가 없어 마릿수 비례 부피는 검사하지 않는다
          # [임시] 구조물 높이 ÷ 바닥 짧은 변. 출력물은 물속 무게가 마른 무게의 약 20%뿐이라 쉽게 기운다
          max_height_to_base_ratio: 1.5
      nano_fish:
        display_name: 나노 어종 (네온·엠버 테트라, 보라라스 등 성체 3cm 이하)
        # 구분: 성체 최대 표준체장(SL) 20~30mm. [근거] SF: 엠버 20, 보라라스 브리지타에 20, CPD 21, 엔들러 25, 네온 30, 피그미 코리 30mm
        #   SL 20mm 미만인 아주 작은 종(보라라스 마이크로스 13mm 등)은 끼임 기준이 더 작아야 해서 이 구분에 넣지 않는다
        # 최대 체고(지느러미 제외) 약 10.9mm (트리고노스티그마 에스페이, SF 30mm SL × FB 비율 — 계산값)
        # [임시] 체고에 지느러미·알 밴 배를 위해 약 1.8배 여유 (배수 출처 없음). J23: 4~5cm 큰가시고기도 지름 22mm 관에 들어갔다
        entrance_min_diameter_mm: 20
        tunnel_min_inner_diameter_mm: 20    # [임시] 출입구와 같게 둔다. J23: 물고기는 통과할 수 있는 관 중에서도 넓은 관을 더 자주 골랐다
        tunnel_max_length_mm: null          # 새우와 같은 이유로 두지 않는다
        gap_trap:
          # [임시] 가장 작은 성체(보라라스 브리지타에·칠리 SL 20mm)의 최대 체고 약 5mm(계산값)의 약 40%. 머리 폭 실측이 없다
          safe_max_mm: 2.0
          # [임시] 출입구 최소 폭과 같게 둔다. 지금 개체가 아니라 성체 최대 크기 기준 (자라서 끼는 사례가 있다)
          passable_min_mm: 20
        min_wall_thickness_mm: 2.0          # [근거] Prusa-W 둘레선 4줄 (새우와 같음)
        hideout_min_entrances:
          # [임시] 물고기는 좁은 곳에서 뒤로 잘 빠져나오지 못한다. N2A 는 뒤로 못 나오는 종이 막힌 동굴에서 끼어 죽을 수 있다고 경고하고,
          #   포럼에서 장식 구멍에 머리부터 들어가 낀 사례가 반복된다. 나노 어종은 늘 무리로 키우므로 혼자일 때도 2개(관통형)
          single: 2
          group: 2
        # [근거] THVO-AT·BMEL 표: 네온 등 '60cm' 등급 = 60×30×30cm. SF 도 네온에 바닥 60×30cm 이상을 권한다. 높이는 비교하지 않는다
        enclosure_min_floor_mm: [600, 300]
        # [근거] BLV: 카디널 테트라 최소 10마리 / SF: 8~10마리 / Saxby et al. 2010: 네온은 10마리 무리에서 공격 행동이 가장 적었다.
        #   THVO-AT·BMEL·OATA 의 무리형 최소는 5마리
        min_recommended_count: 10
        min_count_warning_ko: 나노 어종은 무리를 지어야 안정됩니다. 10마리 이상을 권하며, 5마리 미만은 피하세요.
        aquatic:
          # [임시] 2mm 구멍 + 지붕 2mm 일 때 30°면 공기 약 6.4cm³, 45°면 약 2.1cm³ 가 남는다는 계산값 → 45° (실측 없음)
          ceiling_min_slope_deg: 45
          # [임시] TSchV-CH '수심 ≥ 가장 큰 물고기 몸길이 1배'를 구조물 위 물 깊이에 옮긴 해석 (네온 SL 30mm).
          #   물고기가 구조물 위로 지나가고 수면에서 공기를 마실 수 있게 한다
          structure_top_clearance_mm: 30
          # [임시] 수초 수조 바닥재 기본값: Dennerle 설명서 영양토 1.5~3cm + 자갈 3.5~6cm 의 하한 합. 모래 바닥은 더 얇다(코리도라스 15mm 이하 권고)
          substrate_depth_assumed_mm: 50
          air_gap_mm: 30                    # [근거] EHEIM
          # [근거] THVO-AT: 작은 종도 54L 미만 수조 상시 사육 금지 / BMEL: 54L 최소·60L 권장 / BLV: 3.5~4cm 소형 테트라도 54L 이상
          min_volume_l: 54
          # [근거] TSchV-CH 표 8: 몸길이 5cm 이하 0.5 L/cm × 이 구분 최대 몸길이 3cm = 마리당 1.5L (필요 부피 = max(54, 마리 수 × 1.5))
          volume_l_per_animal: 1.5
          max_height_to_base_ratio: 1.5     # [임시]
      small_fish:
        display_name: 소형 어종 (코리도라스·베타·구피 등 성체 7.5cm 이하, 몸높이 3cm 이하)
        # 구분: 성체 최대 SL 30 초과~75mm 이고 몸높이(체고)가 30mm 이하인 종.
        #   [근거] SF: 할리퀸 45, 판다 코리 50, 허니 구라미 55, 구피 60, 베타 70, 팔레아투스 70, 아에네우스 75, 아피스토 카카투오이데스 수컷 75mm
        #   몸이 높은 종(블랙 스커트 테트라 약 38mm, 드워프 구라미 약 37~41mm, 엔젤피시 등)과 브리슬노즈(SL 125mm)는 넣지 않는다
        # 최대 체고 약 29.6mm (코리도라스 아에네우스, SF 75mm SL × FB 비율 — 계산값)
        # [임시] 체고 × 1.5 여유를 올림 (배수 출처 없음). Ramos et al. 2013: 전장 약 65mm 제브라 플레코도 지름 40mm PVC 관에 들어갔다
        entrance_min_diameter_mm: 45
        tunnel_min_inner_diameter_mm: 45    # [임시] 출입구와 같게 둔다. N2A 는 40mm 양쪽 열린 관을 '메기와 가재'용으로 판다
        tunnel_max_length_mm: null
        gap_trap:
          # [임시] 수치 근거 없음. 코리도라스는 가슴지느러미 가시가 그물코·구멍에 잘 걸린다 (사육 정보·포럼 사례)
          safe_max_mm: 3.0
          # [임시] 출입구 최소 폭과 같게 둔다. 물고기는 몸높이의 절반밖에 안 되는 구멍에도 머리를 밀어 넣는다 (포럼 사례)
          passable_min_mm: 45
        # [임시] 바닥을 뒤지는 종(코리도라스·아피스토)과 손질·청소를 위해 여유를 둔 값. 공개 설계에 2·3mm 변형이 있다
        min_wall_thickness_mm: 2.4
        hideout_min_entrances:              # [임시] 나노 어종과 같은 이유로 관통형(출입구 2개)
          single: 2
          group: 2
        # [근거] BMEL 표·THVO-AT: 코리도라스 아에네우스·베타 모두 '60cm' 등급 (60×30×30cm)
        enclosure_min_floor_mm: [600, 300]
        # [근거] BLV: 코리도라스 최소 6마리 / THVO-AT·BMEL·OATA: 무리형(할리퀸 등) 최소 5마리.
        #   이 구분에는 혼자 키우는 베타 수컷도 들어 있어, 경고 문구에 그 예외를 함께 적는다
        min_recommended_count: 5
        min_count_warning_ko: 코리도라스·할리퀸처럼 무리를 짓는 종은 5마리 이상(코리도라스는 6마리 이상) 함께 키우세요. 베타 수컷은 한 수조에 1마리만 키우는 종이니, 베타라면 단독 사육이 맞습니다.
        aquatic:
          ceiling_min_slope_deg: 30         # [임시] 3~5mm 구멍·30° 이상이면 남는 공기 0.1~1.9cm³ 라는 계산값 (실측 없음)
          # [임시] TSchV-CH '수심 ≥ 가장 큰 물고기 몸길이 1배' 해석 (코리도라스 아에네우스·아피스토 수컷 SL 75mm)
          structure_top_clearance_mm: 75
          substrate_depth_assumed_mm: 50    # [임시] 나노 어종과 같음
          air_gap_mm: 30                    # [근거] EHEIM
          # [근거] THVO-AT 54L 미만 금지 / BLV: 베타도 54L 이상, 30L 미니 수조는 피할 것.
          #   종마다 더 큰 권장치가 있다 (OATA 코리도라스 무리 80L, BLV 아피스토 한 쌍 100L) — 54L 는 절대 하한이다
          min_volume_l: 54
          # [근거] TSchV-CH 표 8: 몸길이 10cm 이하 0.75 L/cm × 이 구분 최대 몸길이 7.5cm = 마리당 약 5.6L
          #   (몸길이 5cm 이하인 종은 실제로 0.5 L/cm 라 과하게 잡힌다)
          volume_l_per_animal: 5.6
          max_height_to_base_ratio: 1.5     # [임시]
      community:
        display_name: 합사 수조 (새우·나노·소형 어종을 함께 키울 때)
        # 여러 구분을 함께 키우면 한 구분에 안전한 크기가 다른 구분에게 덫이 된다 (예: 나노+소형이면 2~45mm 틈이 모두 위험 구간).
        # [임시] 결합 규칙: 위 세 구분 중 가장 작은 safe_max, 가장 큰 passable_min·출입구·통로, 가장 엄격한 소재(새우가 있으면 PETG)를 쓴다.
        #   결합 방식 자체를 다룬 출처는 없고 값은 각 구분에서 가져온다
        entrance_min_diameter_mm: 45        # 소형 어종
        tunnel_min_inner_diameter_mm: 45    # 소형 어종
        tunnel_max_length_mm: null
        gap_trap:
          safe_max_mm: 1.0                  # 새우
          passable_min_mm: 45               # 소형 어종
        min_wall_thickness_mm: 2.4          # 소형 어종
        hideout_min_entrances:              # 물고기 구분
          single: 2
          group: 2
        enclosure_min_floor_mm: [600, 300]  # 나노·소형 어종
        # 마릿수 기준: 섞여 있어 하나로 정할 수 없다 (각 종의 무리 크기를 따로 지킨다)
        min_recommended_count: null
        min_count_warning_ko: null
        aquatic:
          ceiling_min_slope_deg: 45         # 나노 어종
          structure_top_clearance_mm: 75    # 소형 어종
          substrate_depth_assumed_mm: 50
          air_gap_mm: 30                    # [근거] EHEIM
          min_volume_l: 54                  # 나노·소형 어종
          volume_l_per_animal: null         # 새우·물고기가 섞여 마리당 부피를 정할 수 없다
          max_height_to_base_ratio: 1.5
