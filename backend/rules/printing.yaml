# ─────────────────────────────────────────────────────────────────────────────
# 3D 프린팅(FDM) 출력 기준
#
# ⚠️ 임시 기본값입니다. 사용하는 프린터·재료에 맞게 이 파일만 교체하면 반영됩니다.
# 단위: 길이 mm, 면적 mm², 각도 deg
# ─────────────────────────────────────────────────────────────────────────────
version: "0.1-draft"

# 노즐 지름 (참고값)
nozzle_diameter_mm: 0.4
# 출력 가능한 최소 벽 두께 (노즐 0.4mm × 3 둘레)
min_wall_mm: 1.2
# 서포트 없이 출력 가능한 최대 오버행 각도 (수직면 = 0°, 수평 천장 = 90°)
max_overhang_deg: 45
# 이 면적 이하의 오버행은 무시 (작은 구멍 윗부분 등 브리지로 처리 가능한 수준)
overhang_area_tolerance_mm2: 100
# 프린터 출력 공간 [X, Y, Z]
build_volume_mm: [220, 220, 250]
# 3MF 내보내기 시 판 위 파트 간격
plate_spacing_mm: 10
# 장식(무늬·각인)의 최소 형상 크기: 선 폭·점 지름·글자 획. [임시] 노즐 지름 × 3 (벽 최소 두께와 같은 근거)
min_feature_mm: 1.2
# 메시 변환(테셀레이션) 허용 오차
tessellation_tolerance_mm: 0.05
tessellation_angular_tolerance_deg: 5
